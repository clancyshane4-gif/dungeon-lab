[build]
  publish = "site"
  functions = "netlify/functions"
  # The logo comes from the main site so the Lab always matches it. If the download fails the build still goes through.
  command = "curl -fsSL -o site/brand-logo.png 'https://timmysdungeon.com/favicon.png?v=td5' || true"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    # Allow the Lab to be shown inside Whop's member area (Website embed app) and nowhere else.
    Content-Security-Policy = "frame-ancestors 'self' https://whop.com https://*.whop.com"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
